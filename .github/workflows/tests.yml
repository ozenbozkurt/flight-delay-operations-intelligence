name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install ".[charts]" build
      - run: python -m unittest discover -s tests -v
      - run: python -m build
      - run: flight-delay --input examples/demo_flights.csv --output demo-output --min-flights 1 --min-route-flights 1 --charts
